
<html >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Sipariş - Shadow Cafe</title>
    <style>
        /* Genel Stil */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-image: url('https://i.hizliresim.com/iirueiq.jpg'); 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; 
            color: #ffffff;
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        header h1 {
            margin: 0;
            color: #e50914;
            font-size: 2.5em;
        }

        header p {
            font-size: 1.2em;
        }

        .order-container {
            max-width: 800px;
            margin: 20px auto;
            background-color: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.5);
        }

        .order-container h2 {
            color: #e50914;
            font-size: 2em;
            text-align: center;
            margin-bottom: 20px;
        }

        .order-container form {
            display: flex;
            flex-direction: column;
        }

        .order-container label {
            font-size: 1em;
            margin-bottom: 10px;
        }

        .order-container input,
        .order-container select,
        .order-container textarea,
        .order-container button {
            font-size: 1em;
            padding: 10px;
            margin-bottom: 15px;
            border: none;
            border-radius: 5px;
            width: 100%;
        }

        .order-container input,
        .order-container select,
        .order-container textarea {
            background-color: #2c2c2c;
            color: #ffffff;
        }

        .order-container button {
            background-color: #e50914;
            color: #ffffff;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .order-container button:hover {
            background-color: #b20810;
        }

        .info {
            text-align: center;
            margin-top: 20px;
            font-size: 1em;
        }
    </style>
</head>
<body>
    
		

	 <header>
        <h1>Shadow Cafe</h1>
        <nav>
            <a href="menü.html" style="color:#840404; text-decoration: none;" onmouseover="this.style.color='white'" onmouseout="this.style.color='#840404'">Menü</a>
            <a href="hakkımızda.html" style="color: #840404; text-decoration: none;" onmouseover="this.style.color='white'" onmouseout="this.style.color='#840404'">Hakkımızda</a>
            <a href="iletişim.html" style="color: #840404; text-decoration: none;" onmouseover="this.style.color='white'" onmouseout="this.style.color='#840404'">İletişim</a>
            <a href="rezervasyon.html" style="color: #840404; text-decoration: none;" onmouseover="this.style.color='white'" onmouseout="this.style.color='#840404'">Rezervasyon</a>
            <a href="etkinlik.html" style="color:#840404; text-decoration: none;" onmouseover="this.style.color='white'" onmouseout="this.style.color='#840404'">Etkinlik</a>
            <a href="onlinesipariş.html" style="color:#840404; text-decoration: none;" onmouseover="this.style.color='white'" onmouseout="this.style.color='#840404'">Online Sipariş</a>
		</nav>
    </header>
	

    <div class="order-container">
        <h2>Online Sipariş Formu</h2>
        <form action="#" method="POST">
            <label for="name">Adınız:</label>
            <input type="text" id="name" name="name" placeholder="Adınızı girin" required>

            <label for="phone">Telefon Numaranız:</label>
            <input type="tel" id="phone" name="phone" placeholder="Telefon numaranızı girin" required>

            <label for="address">Adresiniz:</label>
            <textarea id="address" name="address" rows="4" placeholder="Sipariş teslim adresinizi girin" required></textarea>

            <label for="order">Siparişinizi Seçin:</label>
            <select id="order" name="order">
                <option value="espresso">Espresso</option>
                <option value="latte">Latte</option>
                <option value="cappuccino">Cappuccino</option>
                <option value="mocha">Mocha</option>
                <option value="americano">Americano</option>
            </select>

            <label for="notes">Ek Notlar:</label>
            <textarea id="notes" name="notes" rows="3" placeholder="Ekstra taleplerinizi buraya yazabilirsiniz"></textarea>

            <button type="submit">Siparişi Gönder</button>
        </form>
    </div>

    <div class="info">
        <p>Shadow Cafe, her zaman yanınızda!</p>
        <p>İletişim: +90 534 917 42 51</p>
    </div>
</body>
</html>
